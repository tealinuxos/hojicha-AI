[package]
name = "hojicha-ai"
version = "0.1.0"
edition = "2021"
description = "Lightweight AI-powered Linux CLI assistant for beginners"
authors = ["Hojicha-AI"]

[[bin]]
name = "hojicha"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
regex = "1"
anyhow = "1"
dialoguer = "0.11"
rustyline = "14.0.0"

# Native local AI inference (Candle)
candle-core = "0.10.2"
candle-transformers = "0.10.2"
hf-hub = "0.4.1"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
